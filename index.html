<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Les Gardiens du Royaume Oublié</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <!-- écran pseudo -->
  <div id="screen-pseudo" class="screen">
    <h1>Entrez votre nom</h1>
    <form id="pseudo-form">
      <input id="pseudo-input" type="text" placeholder="Votre nom..." required>
      <button type="submit">Commencer</button>
    </form>
  </div>

  <!-- écran intro -->
  <div id="screen-intro" class="screen hidden">
    <div id="intro-container">
      <div class="plume-text" data-text="Dans un grimoire poussiéreux, une prophétie renaît de l’oubli..."></div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="timer">60</div>
    <div id="player-name"></div>
  </div>

  <!-- écran victoire -->
  <div id="screen-victory" class="screen hidden">
    <h1>Victoire 🎉</h1>
    <img src="./assets/images/victory.jpg" alt="Victoire">
  </div>

  <!-- écran défaite -->
  <div id="screen-defeat" class="screen hidden">
    <h1>Défaite ❌</h1>
    <img src="./assets/images/defeat.jpg" alt="Défaite">
  </div>

  <!-- écran scores -->
  <div id="screen-scoreboard" class="screen hidden">
    <h2>Tableau des scores</h2>
    <ul id="score-list"></ul>
  </div>

  <!-- Panel admin -->
  <div id="admin-panel" class="hidden">
    <h3>Panel Admin</h3>
    <button id="btn-stop-music">Stop Music</button>
    <button id="btn-force-victory">Forcer Victoire</button>
    <button id="btn-force-defeat">Forcer Défaite</button>
    <button id="btn-reset">Reset Game</button>
  </div>

  <!-- scripts -->
  <script type="module" src="./js/debug.js"></script>
  <script type="module" src="./js/audio.js"></script>
  <script type="module" src="./js/state.js"></script>
  <script type="module" src="./js/router.js"></script>
  <script type="module" src="./js/plume.js"></script>
  <script type="module" src="./js/intro.js"></script>
  <script type="module" src="./js/timer.js"></script>
  <script type="module" src="./js/admin.js"></script>
  <script type="module" src="./js/scoreboard.js"></script>
  <script type="module" src="./js/main.js"></script>

  <script type="module">
    import { initMain } from "./js/main.js";
    import { initRouter } from "./js/router.js";
    import { initPlumeAnimations } from "./js/plume.js";

    document.addEventListener("DOMContentLoaded", () => {
      initMain();
      initRouter();
      initPlumeAnimations();
    });
  </script>
</body>
</html>
